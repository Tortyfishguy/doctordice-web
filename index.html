<!DOCTYPE html>
<!-- หน้าโหลดเว็บ (DECISIONS "grilling หน้าโหลดเว็บ") · custom html shell ของ preset Web แทนหน้าตั้งต้นของ Godot · Steam ไม่ใช้
     ทางเดินเมนูเบลอ โลโก้กลางจอ เส้น ECG เลื่อนวนด้วย CSS transform ที่ขยับต่อได้แม้เกมค้าง แถบความคืบหน้า ข้อความตามภาษาเบราว์เซอร์
     ขั้นดาวน์โหลดจาก onProgress ของ Godot · ขั้นเตรียมห้องตรวจ เกมเรียก ddLoader.prep ทุกเฟรมที่อุ่น shader (src/ui/web_loader.gd)
     เสร็จ ddLoader.done ส่งกล่องโลโก้เมนู → โลโก้เลื่อนไปจอด ที่เหลือจาง 0.4 วินาที แล้วบอกเกมให้เมนูเริ่มท่าเข้า
     พิกัดเป็น px เวที 1920x1080 จากกลุ่ม boot ใน layout/layout-1920x1080.json ที่ tools/web.sh ฝังแทน DD_LAYOUT
     ไฟล์ที่ web.sh วางข้าง index.html: loader-bg.webp ทางเดินเมนูเบลอจาก tools/make_loader_bg.gd · loader-logo.webp จาก art/menu/logo-menu.webp · loader-mitr.ttf จาก fonts/Mitr-Medium.ttf -->
<html lang="th">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Doctor Dice</title>
		<link rel="preload" href="loader-mitr.ttf" as="font" type="font/ttf" crossorigin>
		<style>
@font-face {
	font-family: 'DD Mitr';
	src: url('loader-mitr.ttf') format('truetype');
	font-weight: 500;
	font-display: block;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #061312;
	overflow: hidden;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#ddl {
	position: fixed;
	inset: 0;
	z-index: 10;
	background-color: #061312;
	overflow: hidden;
	font-family: 'DD Mitr', 'Noto Sans Thai', system-ui, sans-serif;
	font-weight: 500;
}

#ddl.is-done {
	background-color: transparent;
	pointer-events: none;
}

.ddl-fade {
	position: absolute;
	inset: 0;
	transition: opacity .4s ease-in;
}

#ddl.is-done .ddl-fade {
	opacity: 0;
}

.ddl-bg {
	position: absolute;
	inset: 0;
	background: url('loader-bg.webp') no-repeat;
}

.ddl-bg::after {
	content: '';
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse 60% 70% at 50% 50%, #0b242280, #04110fd9);
}

.ddl-stage {
	position: absolute;
	left: 0;
	top: 0;
	width: 1920px;
	height: 1080px;
	transform-origin: 0 0;
}

.ddl-stage > *, .ddl-logo {
	position: absolute;
	margin: 0;
	animation: ddl-in .4s ease-out backwards;
}

@keyframes ddl-in {
	from { opacity: 0; }
}

.ddl-logo {
	transform-origin: 0 0;
	z-index: 1;
}

.ddl-bob {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: contain;
	filter: drop-shadow(0 8px 18px #000a);
	animation: ddl-bob 5s ease-in-out infinite;
}

@keyframes ddl-bob {
	0%, 100% { transform: translateY(0) rotate(0deg); }
	30% { transform: translateY(-4px) rotate(-.6deg); }
	70% { transform: translateY(3px) rotate(.5deg); }
}

.ddl-ecg {
	overflow: hidden;
	-webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
	mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
}

.ddl-strip {
	position: absolute;
	left: 0;
	top: 0;
	width: 2000px;
	height: 100%;
	will-change: transform;
	animation: ddl-beat 3.2s linear infinite;
}

.ddl-strip svg {
	display: block;
	overflow: visible;
	filter: drop-shadow(0 0 6px #4dffb8a6);
}

.ddl-strip path {
	fill: none;
	stroke: #8dffd6;
	stroke-width: 5;
	stroke-linejoin: round;
	stroke-linecap: round;
}

@keyframes ddl-beat {
	to { transform: translateX(-1000px); }
}

.ddl-bar {
	border-radius: 6px;
	background: #7fe8c42e;
	overflow: hidden;
}

.ddl-bar i {
	position: absolute;
	inset: 0;
	border-radius: 6px;
	background: #8dffd6;
	box-shadow: 0 0 10px #4dffb8a6;
	transform-origin: 0 0;
	transform: scaleX(0);
	transition: transform .3s ease-out;
}

.ddl-text, .ddl-hint {
	display: grid;
	place-items: center;
	text-align: center;
	white-space: nowrap;
}

.ddl-text {
	font-size: 36px;
	color: #e3f7ef;
	text-shadow: 0 3px 0 #05231f;
	font-variant-numeric: tabular-nums;
}

.ddl-hint {
	font-size: 24px;
	color: #9fbcb7;
	text-shadow: 0 2px 0 #05231f;
	opacity: 0;
	transition: opacity .6s ease-out;
}

#ddl.is-slow .ddl-hint {
	opacity: 1;
}

.ddl-fail {
	display: none;
	box-sizing: border-box;
	padding: 32px 40px;
	border-radius: 24px;
	border: 2px solid #7fe8c455;
	background: #0b2826e6;
	box-shadow: 0 12px 40px #000a;
	text-align: center;
}

.ddl-fail b {
	display: block;
	font-size: 36px;
	font-weight: 500;
	color: #e3f7ef;
}

.ddl-fail small {
	display: block;
	margin-top: 16px;
	font-family: system-ui, sans-serif;
	font-size: 20px;
	line-height: 1.4;
	color: #9fbcb7;
	max-height: 84px;
	overflow: hidden;
	overflow-wrap: anywhere;
	user-select: text;
	-webkit-user-select: text;
}

#ddl.is-fail .ddl-fail {
	display: flex;
	flex-direction: column;
	justify-content: center;
}

#ddl.is-fail :is(.ddl-ecg, .ddl-bar, .ddl-text, .ddl-hint) {
	display: none;
}

@media (prefers-reduced-motion: reduce) {
	.ddl-bob, .ddl-strip, .ddl-stage > *, .ddl-logo {
		animation: none;
	}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="ddl" role="status" aria-busy="true">
			<div class="ddl-fade">
				<div class="ddl-bg"></div>
				<div class="ddl-stage">
					<div class="ddl-ecg" data-box="ecg"><div class="ddl-strip"></div></div>
					<div class="ddl-bar" data-box="bar"><i></i></div>
					<p class="ddl-text" data-box="text"></p>
					<p class="ddl-hint" data-box="hint"></p>
					<div class="ddl-fail" data-box="fail"><b></b><small></small></div>
				</div>
			</div>
			<div class="ddl-logo"><img class="ddl-bob" src="loader-logo.webp" alt=""></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":63473392,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const L = {"boot":{"_note":"2026-11-21 หน้าโหลดเว็บ (DECISIONS \"grilling หน้าโหลดเว็บ\") อยู่ใน web/shell.html tools/web.sh ฝังกลุ่มนี้ลง index.html พื้น = ฉากเมนูเบลอวางแบบ menu.art_offset_x logo = โลโก้กลางจอ เลื่อนไปจอดที่ menu.logo ตอนเสร็จ ecg = เส้นชีพจรเลื่อนวนด้วย CSS ไม่บอกความคืบหน้า bar = แถบความคืบหน้า text = กำลังดาวน์โหลด หรือ กำลังเตรียมห้องตรวจ hint = บรรทัดเล็กหลังรอเกิน 4 วินาที fail = กล่องเปิดเกมไม่ได้","_bg":"2026-11-24 พื้นหน้าโหลด web/loader-bg.webp จาก tools/make_loader_bg.gd = ทางเดินเมนูกว้าง 2640 เบลอ วางที่ x -360 ของเวที 1920 ตรงกับ HallRun บนจอกว้างสุด","bg":[-360,0,2640,1080],"logo":[610,200,700,350],"ecg":[560,590,800,120],"bar":[660,736,600,12],"text":[560,774,800,60],"hint":[460,846,1000,40],"fail":[510,620,900,230]},"art":[-360,2640,1080]};
	const root = document.getElementById('ddl');
	const bg = root.querySelector('.ddl-bg');
	const stage = root.querySelector('.ddl-stage');
	const logo = root.querySelector('.ddl-logo');
	const bob = root.querySelector('.ddl-bob');
	const bar = root.querySelector('.ddl-bar i');
	const text = root.querySelector('.ddl-text');
	const canvas = document.getElementById('canvas');
	const motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;

	// ข้อความตามภาษาเบราว์เซอร์ ไทยหรืออังกฤษ
	const TH = /^th\b/i.test(navigator.language || '');
	const S = TH ? {
		dl: (a, b) => `กำลังดาวน์โหลด ${a} จาก ${b} MB`,
		prep: (p) => `กำลังเตรียมห้องตรวจ ${p}%`,
		hint: 'เปิดครั้งแรกใช้เวลานานหน่อย ครั้งต่อไปจะเร็วขึ้น',
		fail: 'เปิดเกมไม่ได้ ลองรีเฟรชหน้าอีกครั้ง',
	} : {
		dl: (a, b) => `Downloading ${a} of ${b} MB`,
		prep: (p) => `Preparing the exam room ${p}%`,
		hint: 'The first launch takes a while. Next time will be faster.',
		fail: 'The game could not start. Try refreshing the page.',
	};
	document.documentElement.lang = TH ? 'th' : 'en';
	root.querySelector('.ddl-hint').textContent = S.hint;
	root.querySelector('.ddl-fail b').textContent = S.fail;

	// กล่องตามกลุ่ม boot · โลโก้อยู่นอกชั้นที่จาง ให้เลื่อนไปจอดได้โดยไม่จางตาม
	for (const el of root.querySelectorAll('[data-box]')) {
		const [x, y, w, h] = L.boot[el.dataset.box];
		Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
	}

	// เส้นชีพจร 8 ครั้ง กว้าง 2000 เลื่อนวนทีละ 1000 = 4 ครั้งต่อรอบ
	const ecgH = L.boot.ecg[3], mid = ecgH / 2;
	const beat = (x) => [[60, 0], [80, -8], [96, 0], [120, 0], [132, 10], [146, -52], [160, 32], [172, 0], [200, 0], [220, -12], [240, 0]]
		.map(([dx, dy]) => `L${x + dx} ${mid + dy}`).join(' ');
	const d = `M0 ${mid} ${[0, 1, 2, 3, 4, 5, 6, 7].map((k) => beat(k * 250)).join(' ')} L2000 ${mid}`;
	root.querySelector('.ddl-strip').innerHTML = `<svg width="2000" height="${ecgH}" viewBox="0 0 2000 ${ecgH}" aria-hidden="true"><path d="${d}"/></svg>`;

	// เวที 1920x1080 ย่อพอดีจอแล้ววางกลาง แบบเดียวกับเกม · ฉากเบลอวางตาม boot.bg
	function fit() {
		const W = innerWidth, H = innerHeight;
		const s = Math.min(W / 1920, H / 1080);
		const fx = (W - 1920 * s) / 2, fy = (H - 1080 * s) / 2;
		stage.style.transform = `translate(${fx}px, ${fy}px) scale(${s})`;
		bg.style.backgroundSize = `${L.art[1] * s}px ${L.art[2] * s}px`;
		bg.style.backgroundPosition = `${fx + L.art[0] * s}px ${fy}px`;
		if (!root.classList.contains('is-done')) {
			const [x, y, w, h] = L.boot.logo;
			Object.assign(logo.style, { left: fx + x * s + 'px', top: fy + y * s + 'px', width: w * s + 'px', height: h * s + 'px' });
		}
	}
	fit();
	addEventListener('resize', fit);

	// แถบ: ดาวน์โหลด 60% แรก เตรียมห้องตรวจ 40% หลัง
	const DL = 0.6;
	const MB = 1048576;
	let total = 0;
	for (const k in GODOT_CONFIG.fileSizes || {}) {
		total += GODOT_CONFIG.fileSizes[k];
	}
	let phase = 'dl';
	let lastCall = 0;
	const setBar = (k) => { bar.style.transform = `scaleX(${Math.max(0, Math.min(1, k))})`; };
	const showDl = (cur, tot) => {
		const b = Math.max(1, Math.round(tot / MB));
		text.textContent = S.dl(cur >= tot ? b : Math.min(b, Math.floor(cur / MB)), b);
		setBar(DL * cur / tot);
	};
	const showPrep = (p) => {
		if (phase === 'dl') {
			phase = 'prep';
		}
		text.textContent = S.prep(Math.floor(p * 100));
		setBar(DL + (1 - DL) * p);
	};
	if (total > 0) {
		showDl(0, total);
	} else {
		text.textContent = S.prep(0);
	}
	const slow = setTimeout(() => root.classList.add('is-slow'), 4000);

	let finished = false;
	function remove() {
		clearTimeout(slow);
		root.remove();
	}
	// เกมเรียกตอนอุ่น shader ทุกเฟรม
	function prep(p) {
		lastCall = performance.now();
		if (!finished) {
			showPrep(p);
		}
	}
	// กล่องโลโก้เมนูเป็น px ของหน้าต่างเกม → โลโก้เลื่อนไปจอด 0.65 วินาที ที่เหลือจาง 0.4 วินาที แล้วบอกเกม
	function done(x, y, w, h, gone) {
		lastCall = performance.now();
		if (finished) {
			return;
		}
		finished = true;
		showPrep(1);
		root.setAttribute('aria-busy', 'false');
		const c = canvas.getBoundingClientRect();
		const k = c.width / (canvas.width || c.width);
		const r = logo.getBoundingClientRect();
		root.classList.add('is-done');
		const call = () => {
			if (typeof gone === 'function') {
				gone();
			}
			// เกมวาดโลโก้เมนูเฟรมถัดไป ค่อยทิ้งหน้าโหลด
			setTimeout(remove, 150);
		};
		if (!motion || w <= 0 || r.width <= 0) {
			logo.style.transition = 'opacity .4s ease-in';
			logo.style.opacity = '0';
			setTimeout(call, 400);
			return;
		}
		const s = (w * k) / r.width;
		const cur = getComputedStyle(bob).transform;
		bob.style.animation = 'none';
		bob.animate([{ transform: cur }, { transform: 'none' }], { duration: 650, easing: 'ease-out' });
		const to = `translate(${c.left + x * k - r.left}px, ${c.top + y * k - r.top}px) scale(${s})`;
		logo.animate([{ transform: 'none' }, { transform: to }], { duration: 650, easing: 'cubic-bezier(.55,0,.2,1)', fill: 'forwards' })
			.finished.then(call, call);
	}
	function fail(err) {
		console.error(err);
		finished = true;
		clearTimeout(slow);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : '');
		root.querySelector('.ddl-fail small').textContent = msg;
		root.classList.add('is-fail');
		root.setAttribute('aria-busy', 'false');
	}
	window.ddLoader = { prep, done, fail };

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			fail('Missing: ' + missing.join(', '));
		}
	} else {
		// Godot 4.7 ค้างเงียบเมื่อโหลด .wasm ไม่ได้ init ไม่ reject → เริ่มโหลดเองก่อน startGame ใช้ promise เดียวกันจับไว้
		// wasm เสียตอนแปลง Emscripten abort เป็น RuntimeError ที่ไม่มีใครจับ
		const exe = GODOT_CONFIG.executable;
		Engine.load(exe, (GODOT_CONFIG.fileSizes || {})[`${exe}.wasm`]).catch(fail);
		addEventListener('unhandledrejection', (e) => {
			if (phase !== 'run' && e.reason instanceof WebAssembly.RuntimeError) {
				fail(e.reason);
			}
		});
		engine.startGame({
			'onProgress': function (current, tot) {
				if (phase === 'dl' && current > 0 && tot > 0) {
					if (current >= tot) {
						showPrep(0);
					} else {
						showDl(current, tot);
					}
				}
			},
		}).then(() => {
			if (phase === 'dl') {
				showPrep(0);
			}
			phase = 'run';
			// กันเกมไม่ติดต่อหน้าโหลดเลย: เงียบเกิน 30 วินาทีหลังเริ่มเกม = จางหน้าโหลดออกเอง
			lastCall = performance.now();
			const watch = setInterval(() => {
				if (finished) {
					clearInterval(watch);
				} else if (performance.now() - lastCall > 30000) {
					clearInterval(watch);
					finished = true;
					root.classList.add('is-done');
					logo.style.transition = 'opacity .4s ease-in';
					logo.style.opacity = '0';
					setTimeout(remove, 400);
				}
			}, 1000);
		}, fail);
	}
}());
		</script>
	</body>
</html>
